<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Gambar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #FAF8F4;
      --ink: #1C1A17;
      --muted: #7A776F;
      --accent: #C8621A;
      --accent-light: #F5EDE4;
      --border: #E2DDD5;
      --success: #2E7D32;
      --success-bg: #EAF4EA;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card-wrapper {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 4px 32px rgba(28,26,23,0.06);
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }
    .page-subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--cream);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon {
      width: 52px;
      height: 52px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    .drop-icon svg { width: 24px; height: 24px; stroke: var(--accent); }
    .drop-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 0.35rem;
    }
    .drop-hint { font-size: 0.8rem; color: var(--muted); }
    #preview-section { display: none; margin-top: 0; }
    .preview-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #f0ece5;
    }
    .preview-wrap img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }
    .preview-meta {
      padding: 0.6rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    .btn-remove {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      color: #c0392b;
      font-size: 0.8rem;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .btn-remove:hover { background: #fdecea; }
    .form-label { font-size: 0.85rem; font-weight: 500; color: var(--ink); margin-bottom: 0.4rem; }
    .form-control {
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
      padding: 0.6rem 0.85rem;
    }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,98,26,0.12);
      outline: none;
    }
    textarea.form-control { resize: vertical; min-height: 110px; }
    .char-count { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 0.3rem; }
    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { background: #a8511a; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
    #toast-success {
      display: none;
      background: var(--success-bg);
      border: 1px solid #a5d6a7;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--success);
      margin-top: 1rem;
      align-items: center;
      gap: 0.5rem;
    }
    #toast-success.show { display: flex; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 1.75rem 0; }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card-wrapper">

  <p class="page-title">Unggah Gambar</p>
  <p class="page-subtitle">Pilih gambar dan tambahkan deskripsinya.</p>

  <!--
    FORM HTML
    action   : ganti dengan URL endpoint backend kamu
    method   : POST
    enctype  : multipart/form-data (wajib untuk upload file)
    novalidate: validasi ditangani JS sisi klien
  -->
  <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data" novalidate>

    <!-- Drop Zone — JS menangani drag & drop dan preview -->
    <div class="drop-zone" id="dropZone">
      <!-- name="gambar" → field yang diterima backend -->
      <input type="file" id="fileInput" name="gambar" accept="image/*" required />
      <div class="drop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="drop-title">Seret &amp; letakkan gambar di sini</p>
      <p class="drop-hint">atau klik untuk memilih file &mdash; JPG, PNG, WEBP, maks. 5 MB</p>
    </div>

    <!-- Preview — ditampilkan JS setelah file dipilih -->
    <div id="preview-section">
      <div class="preview-wrap">
        <img id="previewImg" src="" alt="Preview gambar"/>
        <div class="preview-meta">
          <span id="fileName">&mdash;</span>
          <!-- type="button" wajib agar tidak men-trigger submit form -->
          <button type="button" class="btn-remove" onclick="removeFile()">&#x2715; Hapus</button>
        </div>
      </div>
    </div>

    <hr class="divider"/>

    <!-- Judul — name="judul" dikirim ke backend -->
    <div class="mb-3">
      <label class="form-label" for="judulInput">Judul Gambar</label>
      <input type="text" class="form-control" id="judulInput" name="judul"
             placeholder="Contoh: Pemandangan Pantai Selatan"
             maxlength="80" oninput="updateChar('judulInput','charJudul')" required/>
      <div class="char-count"><span id="charJudul">0</span>/80</div>
    </div>

    <!-- Deskripsi — name="deskripsi" dikirim ke backend -->
    <div class="mb-3">
      <label class="form-label" for="deskripsiInput">Deskripsi</label>
      <textarea class="form-control" id="deskripsiInput" name="deskripsi"
                placeholder="Tuliskan deskripsi gambar secara singkat dan jelas&hellip;"
                maxlength="500" oninput="updateChar('deskripsiInput','charDeskripsi')" required></textarea>
      <div class="char-count"><span id="charDeskripsi">0</span>/500</div>
    </div>

    <!-- type="submit" → tombol resmi form HTML -->
    <button type="submit" class="btn-submit" id="submitBtn" disabled>
      <span id="btnText">Unggah Sekarang</span>
      <div class="spinner" id="spinner"></div>
    </button>

  </form>

  <!-- Toast di luar form agar tidak ikut dikirim -->
  <div id="toast-success">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    Gambar berhasil diunggah!
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form           = document.getElementById('uploadForm');
  const dropZone       = document.getElementById('dropZone');
  const fileInput      = document.getElementById('fileInput');
  const previewSection = document.getElementById('preview-section');
  const previewImg     = document.getElementById('previewImg');
  const fileNameEl     = document.getElementById('fileName');
  const submitBtn      = document.getElementById('submitBtn');
  const btnText        = document.getElementById('btnText');
  const spinner        = document.getElementById('spinner');
  const toast          = document.getElementById('toast-success');
  let selectedFile     = null;

  /* ── Drag & Drop (JS sisi klien) ── */
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
  });

  /* Pilih file via klik */
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  /* ── Preview gambar (JS sisi klien) ── */
  function handleFile(file) {
    if (file.size > 5 * 1024 * 1024) {
      alert('Ukuran file melebihi 5 MB. Silakan pilih file yang lebih kecil.');
      return;
    }
    selectedFile = file;

    /* Sync file drag-drop ke input[type=file]
       supaya ikut terbaca oleh FormData saat submit */
    const dt = new DataTransfer();
    dt.items.add(file);
    fileInput.files = dt.files;

    const reader = new FileReader();
    reader.onload = ev => {
      previewImg.src = ev.target.result;
      fileNameEl.textContent = file.name + ' \u00b7 ' + (file.size / 1024).toFixed(1) + ' KB';
      previewSection.style.display = 'block';
      dropZone.style.display = 'none';
    };
    reader.readAsDataURL(file);
    checkForm();
  }

  /* Hapus file & munculkan kembali drop zone */
  function removeFile() {
    selectedFile = null;
    fileInput.value = '';
    previewSection.style.display = 'none';
    previewImg.src = '';
    dropZone.style.display = 'block';
    toast.classList.remove('show');
    checkForm();
  }

  /* ── Penghitung karakter (JS sisi klien) ── */
  function updateChar(inputId, counterId) {
    document.getElementById(counterId).textContent =
      document.getElementById(inputId).value.length;
    checkForm();
  }

  /* ── Validasi sisi klien: aktifkan tombol submit ── */
  function checkForm() {
    const judul     = document.getElementById('judulInput').value.trim();
    const deskripsi = document.getElementById('deskripsiInput').value.trim();
    submitBtn.disabled = !(selectedFile && judul && deskripsi);
  }

  /* ────────────────────────────────────────────────────
     Submit via fetch (AJAX)
     - e.preventDefault() mencegah reload halaman
     - new FormData(form) membaca semua field form HTML:
         gambar    → file gambar (input[name="gambar"])
         judul     → teks judul (input[name="judul"])
         deskripsi → teks deskripsi (textarea[name="deskripsi"])
     - fetch mengirim POST ke form.action
     - Content-Type: multipart/form-data di-set otomatis
     - Ganti form.action dengan URL backend kamu
  ──────────────────────────────────────────────────── */
  form.addEventListener('submit', async e => {
    e.preventDefault();

    const formData = new FormData(form); /* ambil data dari form HTML */

    submitBtn.disabled = true;
    btnText.style.display = 'none';
    spinner.style.display = 'block';
    toast.classList.remove('show');

    try {
      const response = await fetch(form.action, {
        method: form.method,   /* POST */
        body:   formData       /* multipart/form-data */
      });

      if (response.ok) {
        toast.classList.add('show');
        /* Opsional reset form setelah sukses: */
        /* form.reset(); removeFile(); */
      } else {
        alert('Gagal mengunggah. Status: ' + response.status);
      }
    } catch (err) {
      /* Demo tanpa backend: tetap tampilkan toast */
      console.warn('Demo mode (tidak ada backend):', err.message);
      toast.classList.add('show');
    } finally {
      spinner.style.display = 'none';
      btnText.style.display = 'block';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
