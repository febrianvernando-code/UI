<!-- dari image3 tambah icon loading saat proses upload -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Gambar dengan Preview</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --drag-hover-bg: #f8f9fc;
        }

        body {
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upload-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        .drop-zone {
            width: 100%;
            height: 350px; 
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            color: #6c757d;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
            background-color: #fafafa;
        }

        /* Perubahan border, background, dan warna saat mouse hover ATAU file ditarik masuk */
        .drop-zone:hover,
        .drop-zone--over {
            border-color: var(--primary-color);
            background-color: var(--drag-hover-bg);
            color: var(--primary-color);
        }

        /* Perubahan warna dan skala ikon saat mouse hover ATAU file ditarik masuk */
        .drop-zone:hover .icon-large,
        .drop-zone--over .icon-large {
            color: var(--primary-color);
            transform: scale(1.1);
        }

        .drop-zone__input {
            display: none;
        }

        .preview-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background-color: #fff;
            z-index: 10;
            padding: 10px;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            border-radius: 8px;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .remove-btn:hover {
            transform: scale(1.1);
            background: #dc3545;
        }

        .icon-large {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: #ced4da;
            transition: all 0.3s ease; 
        }

        .btn-upload {
            background-color: var(--primary-color);
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-upload:hover:not(:disabled) {
            background-color: #3e5fbc;
            box-shadow: 0 4px 12px rgba(78, 115, 223, 0.3);
        }

        .btn-upload:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .form-section {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="upload-card">
        <div class="row g-0">
            <!-- Bagian Kiri: Area Gambar -->
            <div class="col-md-6 bg-light p-4 border-end d-flex flex-column">
                <label class="form-label fw-semibold mb-3">Pratinjau / Drop Zone</label>
                <div class="drop-zone flex-grow-1" id="dropZone">
                    <div class="drop-zone__prompt">
                        <i class="bi bi-image icon-large d-block"></i>
                        <span>Tarik gambar ke sini atau <br><strong>klik untuk memilih</strong></span>
                        <p class="small text-muted mt-2">Format: PNG, JPG atau JPEG</p>
                    </div>
                    
                    <div class="preview-container" id="previewContainer">
                        <button type="button" class="remove-btn" id="removeBtn" title="Hapus Gambar">
                            <i class="bi bi-trash"></i>
                        </button>
                        <img src="" alt="Preview" class="preview-image" id="previewImage">
                    </div>

                    <input type="file" name="myFile" class="drop-zone__input" id="fileInput" accept="image/*">
                </div>
            </div>

            <!-- Bagian Kanan: Input Judul dan Aksi -->
            <div class="col-md-6 form-section">
                <h4 class="mb-4 fw-bold">Detail Gambar</h4>
                
                <form id="uploadForm">
                    <!-- Input Judul Gambar -->
                    <div class="mb-4">
                        <label for="imageTitle" class="form-label fw-semibold">Judul Gambar</label>
                        <input type="text" class="form-control form-control-lg" id="imageTitle" placeholder="Masukkan judul gambar..." required>
                    </div>

                    <!-- Keterangan Tambahan -->
                    <div class="alert alert-light border small text-muted mb-4">
                        <i class="bi bi-info-circle me-2"></i>
                        Gambar besar akan disesuaikan secara otomatis agar tetap proporsional.
                    </div>

                    <!-- Tombol Submit -->
                    <div class="mt-auto">
                        <button type="submit" class="btn btn-primary btn-upload w-100 shadow-sm mb-3" id="submitBtn">
                            <span id="btnContent">
                                <i class="bi bi-cloud-upload me-2"></i>Simpan Perubahan
                            </span>
                            <span id="btnLoading" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                Mengunggah...
                            </span>
                        </button>
                        <p class="text-muted text-center x-small mb-0" style="font-size: 0.8rem;">Maksimal ukuran file: 5MB.</p>
                    </div>
                </form>

                <!-- Message Box -->
                <div id="statusMsg" class="mt-3 text-center d-none"></div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const removeBtn = document.getElementById('removeBtn');
        const uploadForm = document.getElementById('uploadForm');
        const statusMsg = document.getElementById('statusMsg');
        
        // Elemen tombol loading
        const submitBtn = document.getElementById('submitBtn');
        const btnContent = document.getElementById('btnContent');
        const btnLoading = document.getElementById('btnLoading');

        // Klik pada drop zone
        dropZone.addEventListener('click', (e) => {
            if (e.target !== removeBtn && !removeBtn.contains(e.target)) {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files[0]);
        });

        ['dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        dropZone.addEventListener('dragover', () => {
            dropZone.classList.add('drop-zone--over');
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.classList.remove('drop-zone--over');
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            handleFiles(file);
        });

        function handleFiles(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    previewImage.src = reader.result;
                    previewContainer.style.display = 'block';
                };
            } else if (file) {
                showMessage('Harap pilih file gambar yang valid.', 'danger');
                clearFile();
            }
        }

        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearFile();
        });

        function clearFile() {
            fileInput.value = '';
            previewImage.src = '';
            previewContainer.style.display = 'none';
        }

        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('imageTitle').value;
            const file = fileInput.files[0];

            if (!file) {
                showMessage('Pilih gambar terlebih dahulu!', 'warning');
                return;
            }

            // Aktifkan State Loading
            setLoading(true);
            statusMsg.classList.add('d-none');

            // Simulasi proses upload (misal 2 detik)
            setTimeout(() => {
                setLoading(false);
                showMessage(`Sukses! "${title}" telah berhasil diunggah.`, 'success');
                
                setTimeout(() => {
                    uploadForm.reset();
                    clearFile();
                    statusMsg.classList.add('d-none');
                }, 3000);
            }, 2000);
        });

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnContent.classList.add('d-none');
                btnLoading.classList.remove('d-none');
            } else {
                submitBtn.disabled = false;
                btnContent.classList.remove('d-none');
                btnLoading.classList.add('d-none');
            }
        }

        function showMessage(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = `mt-3 text-center alert alert-${type}`;
            statusMsg.classList.remove('d-none');
        }
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
