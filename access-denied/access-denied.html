<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Ditolak - 403 Forbidden</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --accent-color: #dc3545;
            --text-main: #212529;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .icon-box {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .main-icon {
            font-size: 6rem;
            color: var(--accent-color);
            animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both infinite;
            transform: translate3d(0, 0, 0);
        }

        .lock-icon {
            position: absolute;
            bottom: 0;
            right: -10px;
            font-size: 2.5rem;
            background: var(--bg-color);
            border-radius: 50%;
            padding: 5px;
            color: #6c757d;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .error-code {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #dc3545, #9c1c2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-msg {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .error-desc {
            color: #6c757d;
            margin-bottom: 2.5rem;
        }

        .btn-custom {
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 50px;
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .countdown-text {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #adb5bd;
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-main: #e9ecef;
            }
            .lock-icon { background: #121212; }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <!-- Visual Section -->
        <div class="icon-box">
            <i class="bi bi-exclamation-octagon-fill main-icon"></i>
            <i class="bi bi-shield-lock-fill lock-icon"></i>
        </div>

        <!-- Text Section -->
        <div class="error-code">403</div>
        <h1 class="error-msg">Akses Ditolak</h1>
        <p class="error-desc">
            Maaf, Anda tidak memiliki izin untuk mengakses halaman ini. <br>
            Silakan hubungi administrator jika Anda merasa ini adalah kesalahan.
        </p>

        <!-- Action Section -->
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
            <a href="/" class="btn btn-danger btn-custom">
                <i class="bi bi-house-door me-2"></i>Beranda
            </a>
            <button onclick="window.history.back()" class="btn btn-outline-secondary btn-custom">
                <i class="bi bi-arrow-left me-2"></i>Kembali
            </button>
        </div>

        <!-- Interaction Section -->
        <p class="countdown-text">
            Mengarahkan kembali ke Beranda dalam <span id="countdown">15</span> detik...
        </p>
    </div>

    <script>
        // Logika Hitung Mundur
        let seconds = 15;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
                // Ganti URL di bawah ini dengan beranda asli Anda
                // window.location.href = '/'; 
                console.log("Redirecting...");
            }
        }, 1000);

        // Tambahan: Deteksi jika user mencoba refresh terus menerus
        window.addEventListener('load', () => {
            console.log("Halaman akses ditolak dimuat.");
        });
    </script>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
