<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Ditolak - 403 Forbidden</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #4cc9f0;
            --bg-color: #f8faff;
            --text-main: #2b2d42;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(67, 97, 238, 0.05);
        }

        .icon-box {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .main-icon {
            font-size: 5.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        .lock-icon {
            position: absolute;
            bottom: 5px;
            right: -5px;
            font-size: 2rem;
            background: white;
            border-radius: 50%;
            padding: 2px;
            color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-msg {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .error-desc {
            color: #64748b;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-custom-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 0.8rem 2.2rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-custom-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
            color: white;
            filter: brightness(1.1);
        }

        .btn-custom-outline {
            border: 2px solid #e2e8f0;
            color: #64748b;
            padding: 0.8rem 2.2rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-custom-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(67, 97, 238, 0.02);
        }

        .countdown-text {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        #countdown {
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-main: #f1f5f9;
            }
            .error-container {
                background: #1e293b;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            }
            .lock-icon { background: #1e293b; }
            .error-desc { color: #94a3b8; }
            .btn-custom-outline { border-color: #334155; color: #94a3b8; }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <!-- Visual Section -->
        <div class="icon-box">
            <i class="bi bi-shield-lock main-icon"></i>
            <i class="bi bi-patch-exclamation-fill lock-icon"></i>
        </div>

        <!-- Text Section -->
        <div class="error-code">403</div>
        <h1 class="error-msg">Akses Ditolak</h1>
        <p class="error-desc">
            Sistem mendeteksi bahwa Anda tidak memiliki kredensial yang cukup untuk masuk ke area ini.
        </p>

        <!-- Action Section -->
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
            <a href="/" class="btn btn-custom-primary">
                <i class="bi bi-house-door-fill me-2"></i>Kembali ke Beranda
            </a>
            <button onclick="window.history.back()" class="btn btn-custom-outline">
                <i class="bi bi-arrow-left me-2"></i>Halaman Sebelumnya
            </button>
        </div>

        <!-- Interaction Section -->
        <p class="countdown-text">
            Mengarahkan otomatis dalam <span id="countdown">15</span> detik
        </p>
    </div>

    <script>
        // Logika Hitung Mundur
        let seconds = 15;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            if (countdownElement) countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
                // window.location.href = '/'; 
                console.log("Redirecting to home...");
            }
        }, 1000);
    </script>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
