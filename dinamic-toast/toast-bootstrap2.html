<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bootstrap Toast</title>
    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="btn-group">
        <button class="btn btn-success" onclick="notify('Data tersimpan!', 'success')">Sukses</button>
        <button class="btn btn-danger" onclick="notify('Ada error!', 'danger')">Error</button>
        <button class="btn btn-dark" onclick="notify('Halo dari Gemini!', 'dark')">Gelap</button>
    </div>

    <!-- Script JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function notify(message, color = 'primary') {
            // 1. Cari atau buat container
            let container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container position-fixed bottom-0 end-0 p-3';
                document.body.appendChild(container);
            }

            // 2. Buat elemen toast simpel dengan Color Scheme
            const toastEl = document.createElement('div');
            toastEl.className = `toast align-items-center text-white bg-${color} border-0`;
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;

            // 3. Masukkan ke DOM, tampilkan, dan hapus jika sudah selesai
            container.appendChild(toastEl);
            const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });
            bsToast.show();

            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        }
    </script>
</body>
</html>
