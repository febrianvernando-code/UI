<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabulator Bootstrap 5 Integration</title>
    
    <!-- Tailwind CSS for layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tabulator CSS (Bootstrap 5 Theme) -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        .tabulator {
            border: 1px solid #dee2e6 !important;
            background-color: white !important;
            border-radius: 8px !important;
        }
        
        .tabulator-header {
            border-bottom: 2px solid #dee2e6 !important;
            background-color: #f8f9fa !important;
        }

        /* Custom Multi-select Dropdown styling */
        .dropdown-content {
            display: none;
            position: absolute;
            z-index: 50;
            background-color: white;
            min-width: 250px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 0.75 remote;
            border: 1px solid #e5e7eb;
            margin-top: 0.5rem;
        }

        .dropdown-content.show {
            display: block;
        }

        .column-item:hover {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="bi bi-grid-3x3-gap-fill text-blue-600"></i>
                    Manajemen Data (Bootstrap 5)
                </h1>
                <p class="text-slate-500">Gunakan dropdown untuk mengatur kolom tabel.</p>
            </div>

            <div class="relative inline-block text-left">
                <button id="dropdown-btn" class="inline-flex items-center gap-2 px-4 py-2.5 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all">
                    <i class="bi bi-layout-three-columns"></i>
                    Pilih Kolom
                    <i class="bi bi-chevron-down ml-2 text-xs"></i>
                </button>

                <div id="column-dropdown" class="dropdown-content">
                    <div class="p-3 border-bottom bg-slate-50 rounded-t-lg">
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tampilkan Kolom</span>
                    </div>
                    <div id="column-list" class="max-h-60 overflow-y-auto p-2">
                        <!-- Checkbox items will be generated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div id="example-table"></div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-2 rounded-lg opacity-0 transition-opacity duration-300 pointer-events-none z-[100]">
            Kolom diperbarui
        </div>
    </div>

    <script>
        const tableData = [
            {id:1, name:"Budi Santoso", age:28, gender:"Pria", height:170, color:"Biru", dob:"12/01/1995", role:"Developer"},
            {id:2, name:"Siti Aminah", age:24, gender:"Wanita", height:160, color:"Merah", dob:"23/05/1999", role:"Designer"},
            {id:3, name:"Andi Wijaya", age:35, gender:"Pria", height:175, color:"Hijau", dob:"05/08/1988", role:"Manager"},
            {id:4, name:"Rina Putri", age:31, gender:"Wanita", height:165, color:"Kuning", dob:"14/11/1992", role:"QA Engineer"},
            {id:5, name:"Eko Prasetyo", age:22, gender:"Pria", height:180, color:"Hitam", dob:"30/03/2002", role:"Intern"},
            {id:6, name:"Dewi Lestari", age:29, gender:"Wanita", height:158, color:"Ungu", dob:"19/07/1994", role:"HR Specialist"},
            {id:7, name:"Farhan Hakim", age:40, gender:"Pria", height:172, color:"Oren", dob:"02/02/1984", role:"Director"},
        ];

        let table = new Tabulator("#example-table", {
            data: tableData,
            layout: "fitColumns",
            responsiveLayout: "collapse",
            pagination: "local",
            paginationSize: 8,
            movableColumns: true,
            resizableRows: true,
            columns: [
                {title: "Nama", field: "name", width: 150, headerFilter: "text"},
                {title: "Umur", field: "age", hozAlign: "left", formatter: "progress", editor: true},
                {title: "Gender", field: "gender", width: 100},
                {title: "Tinggi (cm)", field: "height", width: 120, hozAlign: "center"},
                {title: "Warna", field: "color", width: 100},
                {title: "Tgl Lahir", field: "dob", width: 130, hozAlign: "center"},
                {title: "Peran", field: "role", width: 130},
            ],
        });

        window.onload = function() {
            const dropdownBtn = document.getElementById("dropdown-btn");
            const dropdownMenu = document.getElementById("column-dropdown");
            const columnList = document.getElementById("column-list");
            
            // Toggle Dropdown visibility
            dropdownBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle("show");
            });

            // Close dropdown when clicking outside
            document.addEventListener("click", () => {
                dropdownMenu.classList.remove("show");
            });

            dropdownMenu.addEventListener("click", (e) => {
                e.stopPropagation();
            });

            const columns = table.getColumnDefinitions();

            columns.forEach(col => {
                // Create Item Container
                const item = document.createElement("label");
                item.className = "column-item flex items-center p-2 rounded cursor-pointer transition-colors";
                
                // Create Checkbox
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 mr-3";
                checkbox.checked = true;
                checkbox.dataset.field = col.field;

                // Create Text Label
                const labelText = document.createElement("span");
                labelText.className = "text-sm text-gray-700 font-medium";
                labelText.textContent = col.title;

                item.appendChild(checkbox);
                item.appendChild(labelText);

                // Change Event
                checkbox.addEventListener("change", function() {
                    const field = this.dataset.field;
                    const column = table.getColumn(field);
                    
                    if (this.checked) {
                        column.show();
                        showToast(`Kolom ${col.title} ditampilkan`);
                    } else {
                        column.hide();
                        showToast(`Kolom ${col.title} disembunyikan`);
                    }
                });

                columnList.appendChild(item);
            });
        };

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.opacity = "1";
            
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2000);
        }
    </script>
</body>
</html>
