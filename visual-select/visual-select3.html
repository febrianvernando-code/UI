<!-- demo with ajax with group select -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Multi-Select - Virtual Select</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Virtual Select CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.39/dist/virtual-select.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .vscomp-wrapper {
            width: 100%;
            border-radius: 0.375rem;
        }
        .vscomp-toggle-button {
            padding: 8px 12px;
            border-color: #dee2e6;
        }
        .label-field {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
            display: block;
        }
        .result-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            min-height: 50px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <h3><i class="bi bi-cloud-download text-primary"></i> Filter Cascading (AJAX)</h3>
                    <p class="text-muted">Mengambil data kota dari server simulasi berdasarkan provinsi yang dipilih</p>
                </div>

                <div class="row g-4">
                    <!-- Dropdown Pertama: Provinsi -->
                    <div class="col-md-6">
                        <label class="label-field">Pilih Provinsi (Multiple)</label>
                        <div id="provinsi-select"></div>
                    </div>

                    <!-- Dropdown Kedua: Kota (Cascading via AJAX) -->
                    <div class="col-md-6">
                        <label class="label-field">Pilih Kota (Multiple & AJAX)</label>
                        <div id="kota-select"></div>
                    </div>
                </div>

                <hr class="my-4">

                <!-- Menampilkan Hasil Pilihan -->
                <div class="result-container">
                    <label class="label-field">Data Terpilih:</label>
                    <div class="result-box" id="output-data">
                        <span class="text-muted">Belum ada data yang dipilih.</span>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button class="btn btn-outline-secondary" onclick="resetFilter()">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset
                    </button>
                    <button class="btn btn-primary" onclick="tampilkanHasil()">
                        <i class="bi bi-check-circle"></i> Simpan Pilihan
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Virtual Select JS -->
<script src="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.39/dist/virtual-select.min.js"></script>

<script>
    // 1. Data Mock (Hanya Provinsi, Kota akan diambil via AJAX)
    const dataProvinsi = [
        { label: 'Jawa Barat', value: 'jabar' },
        { label: 'Jawa Tengah', value: 'jateng' },
        { label: 'Jawa Timur', value: 'jatim' }
    ];

    // Simulasi Database di Server
    const dbServerKota = {
        'jabar': {
            label: 'Jawa Barat',
            options: [
                { label: 'Bandung', value: 'bdg' },
                { label: 'Bekasi', value: 'bks' },
                { label: 'Bogor', value: 'bgr' }
            ]
        },
        'jateng': {
            label: 'Jawa Tengah',
            options: [
                { label: 'Semarang', value: 'smg' },
                { label: 'Solo', value: 'slo' },
                { label: 'Tegal', value: 'tgl' }
            ]
        },
        'jatim': {
            label: 'Jawa Timur',
            options: [
                { label: 'Surabaya', value: 'sby' },
                { label: 'Malang', value: 'mlg' },
                { label: 'Banyuwangi', value: 'bwn' }
            ]
        }
    };

    // Global references
    let provSelect, kotaSelect;

    // 2. Inisialisasi Virtual Select
    window.addEventListener('DOMContentLoaded', function() {
        
        VirtualSelect.init({
            ele: '#provinsi-select',
            options: dataProvinsi,
            multiple: true,
            placeholder: 'Pilih Provinsi...',
            search: true
        });

        VirtualSelect.init({
            ele: '#kota-select',
            options: [],
            multiple: true,
            placeholder: 'Pilih Kota...',
            noOptionsText: 'Pilih provinsi terlebih dahulu',
            loadingText: 'Mengambil data...',
            search: true
        });

        provSelect = document.querySelector('#provinsi-select');
        kotaSelect = document.querySelector('#kota-select');

        // 3. Event Listener dengan Logika AJAX
        provSelect.addEventListener('change', async function() {
            const selectedValues = provSelect.value;
            
            // Akses instance secara aman
            const kotaVS = kotaSelect._virtualSelect || kotaSelect;

            if (!selectedValues || selectedValues.length === 0) {
                if (typeof kotaVS.setOptions === 'function') {
                    kotaVS.setOptions([]);
                }
                return;
            }

            // Tampilkan state loading
            if (typeof kotaVS.toggleLoading === 'function') {
                kotaVS.toggleLoading(true);
            }

            try {
                // Simulasi pemanggilan AJAX/Fetch
                const dataFetched = await fetchKotaDariServer(selectedValues);
                
                // Update dropdown kota dengan hasil fetch
                if (typeof kotaVS.setOptions === 'function') {
                    kotaVS.setOptions(dataFetched);
                }
            } catch (error) {
                console.error("Gagal mengambil data:", error);
            } finally {
                // Matikan state loading
                if (typeof kotaVS.toggleLoading === 'function') {
                    kotaVS.toggleLoading(false);
                }
            }
        });
    });

    // Simulasi Fungsi Fetch (Ganti ini dengan API nyata Anda)
    function fetchKotaDariServer(provIDs) {
        return new Promise((resolve) => {
            // Simulasi delay network 800ms
            setTimeout(() => {
                let results = [];
                const ids = Array.isArray(provIDs) ? provIDs : [provIDs];
                
                ids.forEach(id => {
                    if (dbServerKota[id]) {
                        results.push(dbServerKota[id]);
                    }
                });
                
                resolve(results);
            }, 800);
        });
    }

    function tampilkanHasil() {
        const provVal = provSelect.value;
        const kotaVal = kotaSelect.value;
        const output = document.getElementById('output-data');

        if (!kotaVal || (Array.isArray(kotaVal) && kotaVal.length === 0)) {
            output.innerHTML = `<span class="text-danger">Silakan pilih minimal satu kota.</span>`;
            return;
        }

        output.innerHTML = `
            <strong>Provinsi IDs:</strong> ${provVal.join(', ')} <br>
            <strong>Kota IDs:</strong> ${kotaVal.join(', ')}
        `;
    }

    function resetFilter() {
        const provVS = provSelect._virtualSelect || provSelect;
        const kotaVS = kotaSelect._virtualSelect || kotaSelect;

        if (provVS && typeof provVS.reset === 'function') provVS.reset();
        if (kotaVS) {
            if (typeof kotaVS.setOptions === 'function') kotaVS.setOptions([]);
            if (typeof kotaVS.reset === 'function') kotaVS.reset();
        }
        document.getElementById('output-data').innerHTML = '<span class="text-muted">Belum ada data yang dipilih.</span>';
    }
</script>

</body>
</html>
