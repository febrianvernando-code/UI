<!-- pop up with bootstrap -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Multi-Select Pop-up - Real API</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Virtual Select CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.39/dist/virtual-select.min.css">
    
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-card {
            max-width: 500px;
            width: 100%;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .vscomp-wrapper {
            width: 100%;
            border-radius: 0.375rem;
        }
        .label-field {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
            display: block;
        }
        .result-display {
            background: #ffffff;
            border: 1px dashed #ced4da;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- Halaman Utama -->
<div class="card main-card p-5 text-center">
    <div class="mb-4">
        <div class="display-4 text-primary mb-3"><i class="bi bi-geo-fill"></i></div>
        <h2 class="fw-bold">Pemilih Wilayah</h2>
        <p class="text-muted">Klik tombol di bawah untuk memilih provinsi dan kota di Indonesia.</p>
    </div>

    <!-- Pemicu Modal -->
    <button type="button" class="btn btn-primary btn-lg rounded-pill" data-bs-toggle="modal" data-bs-target="#filterModal">
        <i class="bi bi-search"></i> Buka Filter Wilayah
    </button>

    <!-- Tempat Menampilkan Hasil -->
    <div id="hasil-container" class="result-display d-none">
        <h6 class="text-primary fw-bold mb-2">Pilihan Anda:</h6>
        <div id="output-data" class="small text-start"></div>
    </div>
</div>

<!-- MODAL FILTER -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="filterModalLabel">Filter Wilayah Indonesia</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row g-4">
                    <!-- Dropdown Provinsi -->
                    <div class="col-md-6">
                        <label class="label-field">Provinsi</label>
                        <div id="provinsi-select"></div>
                    </div>

                    <!-- Dropdown Kota -->
                    <div class="col-md-6">
                        <label class="label-field">Kabupaten/Kota</label>
                        <div id="kota-select"></div>
                    </div>
                </div>
                
                <div class="alert alert-info mt-4 mb-0 small border-0">
                    <i class="bi bi-info-circle-fill me-2"></i> Anda dapat memilih lebih dari satu provinsi dan kota sekaligus.
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light rounded-pill px-4" onclick="resetFilter()">Reset</button>
                <button type="button" class="btn btn-primary rounded-pill px-4" onclick="simpanDanTutup()">Terapkan Pilihan</button>
            </div>
        </div>
    </div>
</div>

<!-- Script Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.39/dist/virtual-select.min.js"></script>

<script>
    const API_BASE_URL = 'https://www.emsifa.com/api-wilayah-indonesia/api';
    let provSelect, kotaSelect;

    window.addEventListener('DOMContentLoaded', async function() {
        // 1. Inisialisasi Virtual Select
        VirtualSelect.init({
            ele: '#provinsi-select',
            options: [],
            multiple: true,
            placeholder: 'Memuat provinsi...',
            search: true,
            loadingText: 'Mengambil data...',
            dropboxWidth: '100%'
        });

        VirtualSelect.init({
            ele: '#kota-select',
            options: [],
            multiple: true,
            placeholder: 'Pilih Kabupaten/Kota...',
            noOptionsText: 'Pilih provinsi dahulu',
            loadingText: 'Memuat kota...',
            search: true,
            dropboxWidth: '100%'
        });

        provSelect = document.querySelector('#provinsi-select');
        kotaSelect = document.querySelector('#kota-select');

        // 2. Ambil data Provinsi awal
        await loadProvinsi();

        // 3. Event Cascading
        provSelect.addEventListener('change', async function() {
            const selectedProvIds = provSelect.value;
            const kotaVS = kotaSelect._virtualSelect || kotaSelect;

            if (!selectedProvIds || selectedProvIds.length === 0) {
                if (typeof kotaVS.setOptions === 'function') kotaVS.setOptions([]);
                return;
            }

            if (typeof kotaVS.toggleLoading === 'function') kotaVS.toggleLoading(true);

            try {
                const allKotaData = await loadKotaMultiple(selectedProvIds);
                if (typeof kotaVS.setOptions === 'function') {
                    kotaVS.setOptions(allKotaData);
                }
            } catch (error) {
                console.error("Gagal memuat kota:", error);
            } finally {
                if (typeof kotaVS.toggleLoading === 'function') kotaVS.toggleLoading(false);
            }
        });
    });

    async function loadProvinsi() {
        try {
            const response = await fetch(`${API_BASE_URL}/provinces.json`);
            const data = await response.json();
            const options = data.map(item => ({ label: item.name, value: item.id }));
            const provVS = provSelect._virtualSelect || provSelect;
            if (typeof provVS.setOptions === 'function') provVS.setOptions(options);
        } catch (error) {
            console.error("Error load provinsi:", error);
        }
    }

    async function loadKotaMultiple(provIds) {
        const ids = Array.isArray(provIds) ? provIds : [provIds];
        const promises = ids.map(async (id) => {
            try {
                const provNameResponse = await fetch(`${API_BASE_URL}/province/${id}.json`);
                const provInfo = await provNameResponse.json();
                const response = await fetch(`${API_BASE_URL}/regencies/${id}.json`);
                const data = await response.json();

                return {
                    label: provInfo.name,
                    options: data.map(item => ({ label: item.name, value: item.id }))
                };
            } catch (e) { return null; }
        });

        const results = await Promise.all(promises);
        return results.filter(item => item !== null);
    }

    function simpanDanTutup() {
        const provVS = provSelect._virtualSelect || provSelect;
        const kotaVS = kotaSelect._virtualSelect || kotaSelect;

        const provNames = provVS.getSelectedOptions().map(o => o.label);
        const kotaNames = kotaVS.getSelectedOptions().map(o => o.label);
        
        const output = document.getElementById('output-data');
        const container = document.getElementById('hasil-container');

        if (kotaNames.length === 0) {
            // Gunakan UI sederhana daripada alert browser
            document.querySelector('.modal-body').insertAdjacentHTML('afterbegin', `
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    Pilih minimal satu kota!
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `);
            return;
        }

        output.innerHTML = `
            <p class="mb-1"><strong>Provinsi:</strong> ${provNames.join(', ')}</p>
            <p class="mb-0"><strong>Kota:</strong> ${kotaNames.join(', ')}</p>
        `;
        
        container.classList.remove('d-none');
        
        // Tutup modal secara programatik
        const modalElement = document.getElementById('filterModal');
        const modalInstance = bootstrap.Modal.getInstance(modalElement);
        modalInstance.hide();
    }

    function resetFilter() {
        const provVS = provSelect._virtualSelect || provSelect;
        const kotaVS = kotaSelect._virtualSelect || kotaSelect;
        if (provVS) provVS.reset();
        if (kotaVS) {
            kotaVS.setOptions([]);
            kotaVS.reset();
        }
        document.getElementById('hasil-container').classList.add('d-none');
    }
</script>

</body>
</html>
