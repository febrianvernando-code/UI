<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Date Range Picker (Vanilla JS)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- VanillaJS-Datepicker CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/css/datepicker-bs5.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .picker-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .datepicker-input {
            cursor: pointer !important;
            background-color: #fff !important;
        }
        .info-box {
            margin-top: 20px;
            padding: 15px;
            border-left: 4px solid #0d6efd;
            background-color: #e7f1ff;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="picker-container">
            <h4 class="mb-4 text-center">Pilih Rentang Tanggal</h4>
            
            <div class="row g-3" id="datepicker-range">
                <div class="col-md-6">
                    <label for="start-date" class="form-label">Tanggal Mulai</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar-event" viewBox="0 0 16 16">
                                <path d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-1z"/>
                                <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/>
                            </svg>
                        </span>
                        <input type="text" class="form-control datepicker-input" id="start-date" name="start" placeholder="Pilih tanggal">
                    </div>
                </div>
                
                <div class="col-md-6">
                    <label for="end-date" class="form-label">Tanggal Selesai</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar-check" viewBox="0 0 16 16">
                                <path d="M10.854 7.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 9.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
                                <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/>
                            </svg>
                        </span>
                        <input type="text" class="form-control datepicker-input" id="end-date" name="end" placeholder="Pilih tanggal">
                    </div>
                </div>
            </div>

            <div id="result-info" class="info-box mt-4">
                <strong>Rentang Terpilih:</strong> <span id="display-range">-</span>
            </div>

            <div class="d-grid mt-4">
                <button class="btn btn-primary" id="btn-submit">Proses Reservasi</button>
                <button class="btn btn-link btn-sm mt-2 text-muted" id="btn-reset">Reset Tanggal</button>
            </div>
        </div>
    </div>

    <!-- VanillaJS-Datepicker JS -->
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/datepicker-full.min.js"></script>
    <!-- Bahasa Indonesia (Opsional) -->
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3.4/dist/js/locales/id.js"></script>

    <script>
        // Inisialisasi Date Range Picker
        const rangeElement = document.getElementById('datepicker-range');
        const rangepicker = new DateRangePicker(rangeElement, {
            // Menggunakan tema Bootstrap 5
            buttonClass: 'btn',
            format: 'dd/mm/yyyy',
            autohide: true,
            language: 'id', // Pastikan script locale 'id' sudah dimuat
            todayHighlight: true,
            clearBtn: false
        });

        // Event Listener untuk menampilkan info saat tanggal berubah
        const resultBox = document.getElementById('result-info');
        const displayRange = document.getElementById('display-range');
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');

        const updateDisplay = () => {
            if (startDateInput.value && endDateInput.value) {
                resultBox.style.display = 'block';
                displayRange.textContent = `${startDateInput.value} sampai ${endDateInput.value}`;
            } else {
                resultBox.style.display = 'none';
            }
        };

        startDateInput.addEventListener('changeDate', updateDisplay);
        endDateInput.addEventListener('changeDate', updateDisplay);

        // Fungsi Tombol Submit
        document.getElementById('btn-submit').addEventListener('click', () => {
            const dates = rangepicker.getDates();
            if (dates.length === 2 && dates[0] && dates[1]) {
                const start = dates[0].toLocaleDateString('id-ID');
                const end = dates[1].toLocaleDateString('id-ID');
                alert(`Data berhasil diproses!\nMulai: ${start}\nSelesai: ${end}`);
            } else {
                alert('Silakan pilih rentang tanggal yang lengkap (Mulai & Selesai).');
            }
        });

        // Fungsi Reset
        document.getElementById('btn-reset').addEventListener('click', () => {
            // Cara meriset manual karena DateRangePicker mengharuskan manipulasi input
            startDateInput.value = '';
            endDateInput.value = '';
            // Refresh picker untuk membersihkan highlight internal
            rangepicker.setDates({clear: true});
            resultBox.style.display = 'none';
        });
    </script>
</body>
</html>
