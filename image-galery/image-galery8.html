<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajer Gambar Produk - Elegan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- PhotoSwipe CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f9fafb;
            --card-border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .main-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            max-width: 850px;
            margin: 60px auto;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-section {
            padding: 24px 32px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0;
        }

        .gallery-area {
            padding: 32px;
            min-height: 350px;
            position: relative;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        .img-item-container {
            position: relative;
            aspect-ratio: 1 / 1;
            cursor: grab;
        }

        .order-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--primary-color);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            z-index: 10;
            border: 2px solid white;
        }

        .img-wrapper {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
            background: #f3f4f6;
        }

        .img-item-container:hover .img-wrapper {
            transform: translateY(-4px);
            border-color: var(--primary-color);
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: white;
            color: #ef4444;
            border: none;
            border-radius: 8px;
            width: 28px;
            height: 28px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.2s ease;
            z-index: 11;
        }

        .img-item-container:hover .delete-btn {
            opacity: 1;
        }

        .add-btn-card {
            aspect-ratio: 1 / 1;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn-card:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: #f5f3ff;
        }

        .loader-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .footer-actions {
            padding: 20px 32px;
            background-color: #f9fafb;
            border-top: 1px solid var(--card-border);
            border-radius: 0 0 16px 16px;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 24px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="header-section">
            <h1 class="header-title" id="productTitle">Memuat data produk...</h1>
            <span class="status-badge bg-light text-muted" id="statusBadge">Loading</span>
        </div>

        <div class="gallery-area">
            <!-- Loader saat pertama kali load -->
            <div id="initialLoader" class="loader-container">
                <div class="spinner-border text-primary mb-2" role="status"></div>
                <p class="text-muted small">Mengambil galeri dari server...</p>
            </div>

            <div class="image-grid d-none" id="imageGrid">
                <!-- Dropzone diisi via JS -->
            </div>
            
            <div id="emptyMessage" class="empty-state d-none text-center py-5">
                <i class="bi bi-images" style="font-size: 3rem; opacity: 0.2;"></i>
                <p class="mt-3 text-muted">Belum ada gambar di server.</p>
            </div>
        </div>

        <div class="footer-actions d-flex justify-content-end">
            <button class="btn btn-save" id="btnSave" onclick="saveGallery()" disabled>
                <i class="bi bi-check-circle-fill"></i>Simpan Perubahan
            </button>
        </div>
    </div>
</div>

<input type="file" id="fileInput" hidden accept="image/*" multiple onchange="handleUpload(event)">
<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1100;"></div>

<!-- JS Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

<script type="module">
    import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe-lightbox.esm.min.js';
    const lightbox = new PhotoSwipeLightbox({
        gallery: '#imageGrid',
        children: '.img-wrapper',
        pswpModule: () => import('https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe.esm.min.js')
    });
    lightbox.init();
    window.lightbox = lightbox;
</script>

<script>
    // Mulai dengan array kosong (simulasi state awal sebelum fetch)
    let images = [];

    const grid = document.getElementById('imageGrid');
    const emptyMsg = document.getElementById('emptyMessage');
    const initialLoader = document.getElementById('initialLoader');
    const btnSave = document.getElementById('btnSave');

    // Inisialisasi Sortable
    new Sortable(grid, {
        animation: 150,
        filter: '.add-btn-card',
        onMove: (evt) => evt.related.className.indexOf('add-btn-card') === -1,
        onEnd: () => {
            updateImagesOrderFromDOM();
            render();
        }
    });

    /**
     * SIMULASI: Fetch Data dari Backend saat pertama kali load
     */
    async function initApp() {
        try {
            // Simulasi delay jaringan (1.5 detik)
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Simulasi data yang datang dari API
            const mockApiResponse = [
                { id: 'srv_1', src: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&q=80&w=800', w: 800, h: 1200 },
                { id: 'srv_2', src: 'https://images.unsplash.com/photo-1547949003-9792a18a2601?auto=format&fit=crop&q=80&w=800', w: 800, h: 1000 },
                { id: 'srv_3', src: 'https://images.unsplash.com/photo-1622560480605-d83c853bc5c3?auto=format&fit=crop&q=80&w=800', w: 800, h: 1000 }
            ];

            images = mockApiResponse;
            
            // Update UI Header
            document.getElementById('productTitle').innerText = 'PRD-2024 • Tas Ransel Eksklusif';
            const badge = document.getElementById('statusBadge');
            badge.innerText = 'Aktif';
            badge.className = 'status-badge bg-success-subtle text-success px-2 py-1 rounded-pill small';

        } catch (error) {
            showToast('Gagal memuat data dari server', 'danger');
        } finally {
            // Hilangkan loader dan tampilkan grid
            initialLoader.classList.add('d-none');
            grid.classList.remove('d-none');
            btnSave.disabled = false;
            render();
        }
    }

    function updateImagesOrderFromDOM() {
        const currentItems = Array.from(grid.querySelectorAll('.img-item-container'));
        images = currentItems.map(item => images.find(img => img.id === item.dataset.id));
    }

    function handleUpload(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    images.push({ 
                        id: 'new_' + Math.random().toString(36).substr(2, 9), 
                        src: event.target.result,
                        w: img.width,
                        h: img.height
                    });
                    render();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        e.target.value = '';
    }

    function removeImg(id, e) {
        if(e) { e.preventDefault(); e.stopPropagation(); }
        images = images.filter(item => item.id !== id);
        render();
    }

    function render() {
        grid.innerHTML = '';
        if (images.length === 0) {
            emptyMsg.classList.remove('d-none');
        } else {
            emptyMsg.classList.add('d-none');
            images.forEach((img, index) => {
                const container = document.createElement('div');
                container.className = 'img-item-container';
                container.dataset.id = img.id;
                container.innerHTML = `
                    <div class="order-badge">${index + 1}</div>
                    <a href="${img.src}" class="img-wrapper" data-pswp-width="${img.w}" data-pswp-height="${img.h}">
                        <img src="${img.src}" alt="Product">
                    </a>
                    <button class="delete-btn" onclick="removeImg('${img.id}', event)"><i class="bi bi-trash3-fill"></i></button>
                `;
                grid.appendChild(container);
            });
        }

        const addBtn = document.createElement('div');
        addBtn.className = 'add-btn-card';
        addBtn.onclick = () => document.getElementById('fileInput').click();
        addBtn.innerHTML = `<i class="bi bi-plus-lg fs-4"></i><span class="small fw-medium">Tambah</span>`;
        grid.appendChild(addBtn);
    }

    async function saveGallery() {
        const originalHTML = btnSave.innerHTML;
        btnSave.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
        btnSave.disabled = true;

        try {
            await fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                body: JSON.stringify({ images }),
                headers: { 'Content-type': 'application/json' }
            });
            showToast('Perubahan berhasil disimpan ke server!', 'success');
        } catch (error) {
            showToast('Gagal menyimpan perubahan', 'danger');
        } finally {
            btnSave.innerHTML = originalHTML;
            btnSave.disabled = false;
        }
    }

    function showToast(msg, type) {
        const container = document.getElementById('toast-container');
        const id = 't_' + Date.now();
        container.insertAdjacentHTML('beforeend', `
            <div id="${id}" class="toast align-items-center text-white ${type === 'danger' ? 'bg-danger' : 'bg-dark'} border-0" role="alert">
                <div class="d-flex p-2">
                    <div class="toast-body"><i class="bi bi-info-circle-fill me-2"></i>${msg}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        `);
        const el = document.getElementById(id);
        new bootstrap.Toast(el).show();
        el.addEventListener('hidden.bs.toast', () => el.remove());
    }

    // Panggil inisialisasi saat window load
    window.onload = initApp;
</script>
</body>
</html>
