<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Login - Bank Image</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #4cc9f0;
            --bg-gradient: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Dekorasi Latar Belakang */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            z-index: -1;
        }

        /* Kartu Login dengan efek Glassmorphism */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-logo-container {
            width: 80px; /* Diperbesar dari 60px */
            height: 80px; /* Diperbesar dari 60px */
            background: var(--primary-color);
            border-radius: 20px; /* Sedikit disesuaikan */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(67, 97, 238, 0.4);
            font-size: 2.5rem; /* Ukuran ikon diperbesar dari 1.8rem */
        }

        .brand-name {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.025em;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background: transparent;
            border-right: none;
            color: #94a3b8;
            padding-left: 1.25rem;
        }

        .form-control {
            border-left: none;
            padding: 0.75rem 1.25rem 0.75rem 0;
            border-radius: 0 12px 12px 0;
            font-size: 0.95rem;
            color: #1e293b;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #dee2e6;
        }

        .input-group:focus-within {
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
            border-radius: 12px;
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: var(--primary-color);
        }

        .btn-login {
            background: var(--primary-color);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-login:hover {
            background: #3651d1;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(67, 97, 238, 0.3);
        }

        .alert {
            border-radius: 12px;
            font-size: 0.875rem;
            display: none;
            border: none;
        }

        .custom-loader {
            width: 20px;
            height: 20px;
            border: 3px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Animasi Lingkaran Latar Belakang -->
    <div class="bg-circle" style="width: 300px; height: 300px; top: -100px; left: -100px;"></div>
    <div class="bg-circle" style="width: 400px; height: 400px; bottom: -150px; right: -100px;"></div>

    <div class="login-card">
        <div class="brand-section">
            <div class="brand-logo-container">
                <i class="bi bi-images"></i>
            </div>
            <div class="brand-name">Bank Image</div>
            <p class="text-muted small mt-2">Kelola aset visual Anda dengan cerdas</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="nama@perusahaan.com" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <label class="form-label">Kata Sandi</label>
                    <a href="#" class="text-decoration-none small fw-bold" style="color: var(--primary-color)">Lupa?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div id="statusAlert" class="alert mb-4"></div>

            <button type="submit" class="btn btn-primary btn-login w-full d-flex align-items-center justify-content-center gap-2" id="submitBtn">
                <span id="btnText">Masuk ke Akun</span>
                <span class="custom-loader" id="loader"></span>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted small">Belum terdaftar? <a href="#" class="fw-bold text-decoration-none" style="color: var(--primary-color)">Buat Akun Gratis</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const statusAlert = document.getElementById('statusAlert');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Reset UI
            statusAlert.style.display = 'none';
            submitBtn.disabled = true;
            btnText.innerText = 'Memverifikasi...';
            loader.style.display = 'inline-block';

            // Simulasi Network Request
            setTimeout(() => {
                if (email === "user@bankimage.com" && password === "123456") {
                    statusAlert.className = 'alert alert-success d-block';
                    statusAlert.innerHTML = '<strong>Berhasil!</strong> Mengalihkan ke dashboard...';
                    
                    // Beri sedikit waktu untuk melihat feedback sukses
                    setTimeout(() => {
                        window.location.reload(); 
                    }, 2000);
                } else {
                    statusAlert.className = 'alert alert-danger d-block';
                    statusAlert.innerHTML = '<strong>Akses Ditolak!</strong> Email atau password salah.';
                    
                    // Kembalikan tombol ke keadaan normal
                    submitBtn.disabled = false;
                    btnText.innerText = 'Masuk ke Akun';
                    loader.style.display = 'none';
                }
            }, 1500);
        });
    </script>
</body>
</html>
